services:
  - type: web
    name: blueorion-unified-qms-portal
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: npm install
    startCommand: node server-enhanced.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: API_RATE_LIMIT_MAX
        value: "600"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: PORTAL_MODULES
        value: "sourcing,welfare,grievance,audit,doc_control,tracker"
      - key: DATABASE_URL
        fromDatabase:
          name: blueorion-qms-db
          property: connectionString
    disk:
      name: qms-permanent-storage
      mountPath: /data
      sizeGB: 5

databases:
  - name: blueorion-qms-db
    plan: free
    databaseName: blueorion_qms
    user: blueorion
