<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueorion QMS Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; max-width: 900px; margin: 0 auto; }
        .module-card { background: white; padding: 32px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; font-size: 18px; font-weight: bold; color: #003366; transition: box-shadow 0.2s, transform 0.2s; }
        .module-card:hover { box-shadow: 0 6px 18px rgba(0,51,102,0.13); transform: translateY(-3px) scale(1.03); }
        .logo { width: 200px; margin: 20px auto; display: block; }
    </style>
</head>
<body>
    <img src="/assets/BLUELOGO2026.png" alt="Blueorion Logo" class="logo">
    <h1>QMS Dashboard</h1>
    <div class="dashboard-grid" id="dashboardGrid">
        <!-- Module cards will be injected here -->
    </div>
    <script>
        // Module definitions (names and routes)
        const modules = [
            { name: '⚡ Staff Workstation (All-in-One)', route: '/workstation' },
            { name: '1. Welfare & Monitoring / Complaints', route: '/views/welfare_monitoring.html' },
            { name: '2. Sourcing', route: '/sourcing-dashboard' },
            { name: '4. Management & Leadership', route: '/admin#management' },
            { name: '5. Resource & Competence', route: '/admin#resource' },
            { name: '6. Audit & Improvement', route: '/admin#audit' },
            { name: '7. Document Control', route: '/admin#document' },
            { name: '8. Payment & Voucher', route: '/expense-voucher' },
            { name: '9. Profile & Contact', route: '/admin#profile' },
            { name: '10. Selection & CV', route: '/admin#selection' },
            { name: '11. Contract & Re-engagement', route: '/admin#contract' },
            { name: '12. FRA System', route: '/admin#fra' }
        ];
        // Render module cards
        const grid = document.getElementById('dashboardGrid');
        modules.forEach((mod, idx) => {
            const card = document.createElement('div');
            card.className = 'module-card';
            card.textContent = mod.name;
            card.onclick = () => window.location.href = mod.route;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
