services:
  - type: web
    name: blueorion-qms
    runtime: node
    plan: free
    autoDeploy: false
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: API_RATE_LIMIT_MAX
        value: "600"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: blueorion-qms-db
          property: connectionString
    disk:
      name: qms-permanent-storage
      mountPath: /data
      sizeGB: 1

databases:
  - name: blueorion-qms-db
    plan: free
    databaseName: blueorion_qms
    user: blueorion
