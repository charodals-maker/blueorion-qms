<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueorion Live Selection Table</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <div class="main-pane standalone">
        <div class="dashboard-header">
            <div class="welcome-section">
                <h1>BLUEORION LIVE SELECTION TABLE</h1>
                <p>Search, Notes, Medical Upload, WhatsApp, and Print Bio-Data</p>
            </div>
            <div class="system-status">
                <span class="status-indicator">? Selection Active</span>
                <span class="date-display">System #11</span>
            </div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <input type="text" placeholder="Search notes: Qatar, English, Nurse">
                <select>
                    <option>All Statuses</option>
                    <option>Interview Scheduled</option>
                    <option>Medical Pending</option>
                    <option>Fit to Work</option>
                </select>
            </div>

            <table class="live-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Dela Cruz, Juan</td>
                        <td><span class="status-fit">Fit to Work</span></td>
                        <td>Ex-Qatar; Skilled Labor; Excellent English</td>
                        <td>?? View | ?? WhatsApp | ??? Print Bio</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script src="/assets/i18n.js?v=2.1"></script>
</body>
</html>
