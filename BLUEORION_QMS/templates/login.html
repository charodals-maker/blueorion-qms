<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueorion QMS Login</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="dashboard-header">
            <div class="welcome-section">
                <h1>BLUEORION RECRUITMENT SERVICES CORP</h1>
                <p>Quality Management System | Atlantis Beacon Tower, Malate, Manila</p>
            </div>
            <div class="system-status">
                <span class="status-indicator">● System Online</span>
                <span class="date-display">April 14, 2026</span>
            </div>
        </div>

        <div class="panel auth-card">
            <h2>Secure Login</h2>
            <p>Use your assigned username and temporary password, then change it on first access.</p>
            <form>
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="blueorion_staff01">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Temporary password">
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
