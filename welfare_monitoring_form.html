<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Welfare Complaint Form</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        body { background: #f4f8ff; font-family: Arial, sans-serif; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 32px; }
        h2 { color: #003366; text-align: center; margin-bottom: 24px; }
        label { font-weight: 600; color: #003366; margin-top: 12px; display: block; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        textarea { min-height: 80px; }
        button { width: 100%; background: #003366; color: #fff; border: none; border-radius: 6px; padding: 14px; font-size: 16px; font-weight: 700; margin-top: 18px; cursor: pointer; }
        button:hover { background: #004a80; }
        .success, .error { margin-top: 18px; padding: 12px; border-radius: 6px; font-size: 14px; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #59d997; }
        .error { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welfare & Monitoring - Worker Complaint</h2>
        <form id="complaintForm">
            <label for="workerName">Worker Name</label>
            <input type="text" id="workerName" name="workerName" required>


            <label for="mobileNo">Mobile No.</label>
            <input type="tel" id="mobileNo" name="mobileNo" required pattern="[0-9+\- ]{7,15}" placeholder="e.g. +63917...">

            <label for="fraName">FRA Name</label>
            <select id="fraName" name="fraName" required>
                <option value="">-- Select Agency --</option>
                <option value="Rawdah Recruitment">Rawdah Recruitment (Saudi)</option>
                <option value="IRC Malaysia Agency">IRC Malaysia Agency (Malaysia)</option>
            </select>

            <label for="complaintDetails">Complaint Details</label>
            <textarea id="complaintDetails" name="complaintDetails" placeholder="Describe the issue, root cause, etc..." required></textarea>

            <label for="urgency">Urgency Level</label>
            <select id="urgency" name="urgency" required>
                <option value="">-- Select --</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Submit Complaint</button>
        </form>
        <div id="formMessage"></div>
            <h3 style="margin-top:32px;color:#b91c1c;">Recent Complaints</h3>
            <table id="complaintsTable" style="width:100%;margin-top:10px;border-collapse:collapse;font-size:14px;">
                <thead>
                    <tr style="background:#f4f8ff;color:#003366;">
                        <th style="padding:6px 8px;">Ref #</th>
                        <th style="padding:6px 8px;">Date</th>
                        <th style="padding:6px 8px;">Worker</th>
                        <th style="padding:6px 8px;">FRA</th>
                        <th style="padding:6px 8px;">Urgency</th>
                        <th style="padding:6px 8px;">Status</th>
                    </tr>
                </thead>
                <tbody id="complaintsTableBody">
                </tbody>
            </table>
    </div>
    <script>
        function addComplaintToTable(refNo, date, worker, fra, urgency, status) {
            const table = document.getElementById('complaintsTableBody');
            const urgentStyle = urgency === 'High' ? 'background:#ffeaea;color:#b91c1c;font-weight:bold;' : '';
            table.innerHTML = `<tr style="${urgentStyle}">
                <td>${refNo}</td>
                <td>${date}</td>
                <td>${worker}</td>
                <td>${fra}</td>
                <td>${urgency}</td>
                <td><span style="color:red">OPEN</span></td>
            </tr>` + table.innerHTML;
        }

        document.getElementById('complaintForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            // Generate unique reference number (timestamp + random)
            const refNo = 'WEL-' + Date.now() + '-' + Math.floor(Math.random()*1000);
            const data = {
                workerName: form.workerName.value,
                mobileNo: form.mobileNo.value,
                fraName: form.fraName.value,
                complaintDetails: form.complaintDetails.value,
                urgency: form.urgency.value,
                referenceNo: refNo
            };
            const msg = document.getElementById('formMessage');
            msg.textContent = '';
            msg.className = '';
            try {
                const res = await fetch('/api/welfare-complaints', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Failed to submit complaint.');
                // CAPA flagging: check for repeated complaints (simulate with localStorage for demo)
                let capaKey = 'capa-' + data.fraName + '-' + data.complaintDetails.toLowerCase().split(' ')[0];
                let capaCount = parseInt(localStorage.getItem(capaKey) || '0', 10) + 1;
                localStorage.setItem(capaKey, capaCount);
                let capaMsg = '';
                if (capaCount >= 3) {
                    capaMsg = `\n⚠️ CAPA SUGGESTION: Multiple complaints for this FRA/category. Please review for corrective action.`;
                }
                msg.innerHTML = `✅ Complaint submitted!<br><b>Reference No:</b> ${refNo}` + (capaMsg ? `<br><span style='color:#b91c1c;'>${capaMsg}</span>` : '');
                msg.className = 'success';
                addComplaintToTable(refNo, new Date().toLocaleDateString(), data.workerName, data.fraName, data.urgency, 'OPEN');
                form.reset();
                // Update dashboard instantly if available
                if (window.parent && typeof window.parent.updateStatCards === 'function') {
                    window.parent.updateStatCards();
                } else if (typeof updateStatCards === 'function') {
                    updateStatCards();
                }
                // Also update Red card directly if present
                const countElement = document.getElementById('welfare-count');
                if (countElement) {
                    let currentCount = parseInt(countElement.innerText) || 0;
                    countElement.innerText = currentCount + 1;
                }
            } catch (err) {
                msg.textContent = '❌ ' + err.message;
                msg.className = 'error';
            }
        });
    </script>
</body>
</html>
